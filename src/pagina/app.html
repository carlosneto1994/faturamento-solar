<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faturamento de Energia Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#15211c; --muted:#5d6b65; --line:#dfe5e2;
  --pri:#12715b; --pri-2:#0d5847; --pri-soft:#e6f2ee; --sun:#f2a900; --sun-soft:#fff6dc;
  --red:#c2412d; --red-soft:#fdecea; --blue:#2563a8;
  --r:12px; --sh:0 1px 2px rgba(16,30,24,.06),0 4px 16px rgba(16,30,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.topo{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topo .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:0}
.marca img{height:34px;max-width:120px;object-fit:contain}
.marca .sol{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--sun),#f7c948);display:grid;place-items:center;color:#5a3d00;font-weight:800}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:500}
nav a:hover{background:var(--bg);color:var(--ink)}
nav a.on{background:var(--pri-soft);color:var(--pri-2);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.esp{flex:1}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#bfcac5}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-2)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3d2a00}
.btn.perigo{color:var(--red)}
.btn.peq{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
label.campo input,label.campo select,label.campo textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);font-size:14px;min-width:0}
label.campo input:focus,label.campo select:focus,label.campo textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.tile .k{font-size:12px;color:var(--muted);font-weight:500}
.tile .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile.verde .v{color:var(--pri)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #edf1ef;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8faf9}
.tabela{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-aberta{background:var(--sun-soft);color:#8a5d00}
.b-paga{background:var(--pri-soft);color:var(--pri-2)}
.b-atrasada{background:var(--red-soft);color:var(--red)}
.vazio{text-align:center;color:var(--muted);padding:40px 10px}
.drop{display:block;border:2px dashed #b9c8c1;border-radius:var(--r);background:#fbfdfc;padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
.drop.on,.drop:hover{border-color:var(--pri);background:var(--pri-soft)}
.drop b{font-size:16px}
.aviso{background:var(--sun-soft);border:1px solid #f3dc9a;color:#6b4a00;border-radius:9px;padding:9px 12px;font-size:13px;margin:8px 0}
.aviso.erro{background:var(--red-soft);border-color:#f2c2bb;color:#8f2a1b}
.aviso.ok{background:var(--pri-soft);border-color:#bfe0d5;color:var(--pri-2)}
.conta{margin-top:16px}
.conta-cab{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.conta-cab .t{font-weight:700;font-size:15px}
.conta-cab .m{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.secao{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 8px}
.calc{background:#f8faf9;border:1px solid var(--line);border-radius:10px;padding:14px}
.calc .l{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.calc .l.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700;font-size:16px}
.calc .l.eco{color:var(--pri);font-weight:600}
.calc .l.neg{color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(10,20,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:14px;max-width:980px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .corpo{padding:18px}
.modal.peq{max-width:460px}
.prev{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}
@media (max-width:820px){.prev{grid-template-columns:1fr}}
.prev img{width:100%;border:1px solid var(--line);border-radius:6px;box-shadow:var(--sh);background:#fff}
.lado .btn{width:100%;justify-content:center;margin-bottom:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15211c;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.logo-prev{width:200px;height:90px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logo-prev img{max-width:180px;max-height:76px}
.pequeno{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.faixa.ok{background:var(--pri-soft);border-bottom-color:#bfe0d5;color:var(--pri-2)}
.faixa .btn{margin-left:10px;padding:4px 12px}
.faixa{background:var(--sun-soft);border-bottom:1px solid #f3dc9a;color:#6b4a00;font-size:13px;padding:8px 20px;text-align:center}
.carregando{display:inline-block;width:14px;height:14px;border:2px solid #cfd8d4;border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
@keyframes g{to{transform:rotate(360deg)}}
.oculto{display:none!important}
.versao{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.versao.nova{background:var(--pri-soft);color:var(--pri-2);border-color:#bfe0d5;cursor:pointer}
.versao:empty{display:none}
table.inj td{padding:5px 6px}table.inj th{padding:6px}
table.inj input,table.inj select{border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff;font-size:13px}
table.inj tr.tot-inj td{border-bottom:none}
.legenda{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:-4px 0 6px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i,.dica i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.graf svg{display:block;font-family:Inter,system-ui,sans-serif}
.dica{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px rgba(16,30,24,.14);padding:8px 11px;font-size:12.5px;line-height:1.55;pointer-events:none;font-variant-numeric:tabular-nums}
.tile .pequeno{margin-top:2px}
.tile.alerta .v{color:var(--red)}
.rank{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid #edf1ef;cursor:pointer;border-radius:8px}
.rank:hover{background:#f8faf9}
.rk-n{display:flex;flex-direction:column;min-width:0}.rk-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-b{height:10px;background:#f0f3f2;border-radius:5px;overflow:hidden}.rk-b div{height:100%;background:#2a78d6;border-radius:0 4px 4px 0}
.rk-v{font-weight:700;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
</style>
</head>
<body>
<div id="faixa" class="faixa oculto"></div>
<div id="faixaAtual" class="faixa ok oculto"></div>
<header class="topo"><div class="in">
  <div class="marca" id="marca"><div class="sol">☀</div><span>Faturamento Solar</span></div>
  <span id="versao" class="versao" title="Versão do programa"></span>
  <nav id="nav">
    <a href="#painel" data-r="painel">Painel</a>
    <a href="#faturas" data-r="faturas">Faturas</a>
    <a href="#nova" data-r="nova">Nova fatura</a>
    <a href="#clientes" data-r="clientes">Clientes</a>
    <a href="#empresa" data-r="empresa">Minha empresa</a>
  </nav>
</div></header>
<main id="app"><p class="vazio"><span class="carregando"></span> Carregando…</p></main>
<div id="modais"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
"use strict";
// ======================= Utilidades =======================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = v => Math.round((+v || 0) * 100) / 100;
const fmtR = v => (v == null || isNaN(v)) ? '—' : (+v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtN = (v, d = 0) => (v == null || isNaN(v)) ? '—' : (+v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtP = v => (v == null || isNaN(v)) ? '—' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const soDig = s => String(s || '').replace(/\D/g, '');
const MESES_N = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const refTxt = (m, a) => m && a ? `${MESES_N[m - 1]}/${a}` : '—';
const refKey = (m, a) => `${a}-${String(m).padStart(2, '0')}`;
const parseBR = s => { if (typeof s === 'number') return s; s = String(s || '').trim(); if (!s) return null; s = s.replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const v = parseFloat(s); return isNaN(v) ? null : v; };
const dataBR = d => { const z = n => String(n).padStart(2, '0'); return `${z(d.getDate())}/${z(d.getMonth() + 1)}/${d.getFullYear()}`; };
const deBR = s => { const m = String(s || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const hoje0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const numBR = v => (v == null || isNaN(v)) ? '' : String(r2(v)).replace('.', ',');
function toast(msg, ms = 2600) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

// ======================= Dados =======================
const S = { clientes: [], faturas: [], empresa: {}, pronto: { c: false, f: false, e: false }, db: null, down: null, nuvem: false };
const EMPRESA_PADRAO = { nome: 'Minha Empresa Solar', cnpj: '', endereco: '', telefone: '', email: '', cor: '#12715b', pixChave: '', pixNome: '', pixCidade: '', proximoNumero: 1, diasVencimento: 10, mensagem: 'Obrigado por gerar energia limpa com a gente!', logo: '' };
const emp = () => Object.assign({}, EMPRESA_PADRAO, S.empresa || {});

const memoria = { // reserva local quando a nuvem não está disponível
  ler() { try { return JSON.parse(localStorage.getItem('fatsolar') || '{}'); } catch (e) { return {}; } },
  gravar() { try { localStorage.setItem('fatsolar', JSON.stringify({ clientes: S.clientes, faturas: S.faturas, empresa: S.empresa })); } catch (e) {} }
};

// ----- Versão instalada no computador: dados num arquivo local, via o próprio programa -----
const API = {
  async req(metodo, url, corpo, tipo) {
    const r = await fetch(url, { method: metodo, body: corpo, headers: tipo ? { 'Content-Type': tipo } : {} });
    if (!r.ok) { const e = new Error('Falha ao gravar (' + r.status + ')'); e.code = 'local'; throw e; }
    return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
  },
  gravar(col, id, dados) { return this.req('PUT', `/api/doc/${col}/${encodeURIComponent(id)}`, JSON.stringify(dados), 'application/json'); },
  apagar(col, id) { return this.req('DELETE', `/api/doc/${col}/${encodeURIComponent(id)}`); }
};
async function iniciarLocal() {
  const d = await API.req('GET', '/api/dados');
  S.local = true; S.clientes = d.clientes || []; S.faturas = d.faturas || []; S.empresa = d.empresa || {}; S.pastas = d.pastas || {};
  S.pronto = { c: true, f: true, e: true };
  S.down = { save: async ({ filename, data }) => {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const r = await API.req('POST', '/api/arquivo?nome=' + encodeURIComponent(filename), blob, 'application/octet-stream');
    toast('Salvo em ' + r.caminho, 5000); return { status: 'saved' };
  } };
  setInterval(() => fetch('/api/ping', { method: 'POST' }).catch(() => {}), 20000); fetch('/api/ping', { method: 'POST' }).catch(() => {});
  checarAtualizacao(); setTimeout(checarAtualizacao, 6000); setInterval(checarAtualizacao, 60000);
  aplicarMarca(); render();
}
// Atualização automática (programa instalado)
async function checarAtualizacao() {
  try {
    const a = await (await fetch('/api/atualizacao')).json(); S.atualizacao = a;
    const f = $('#faixaAtual');
    if (a.status === 'pronta') {
      f.innerHTML = `Nova versão ${esc(a.nova)} instalada${a.notas ? ': ' + esc(a.notas) : ''}. <button class="btn pri" id="bReini">Reiniciar agora</button>`;
      f.classList.remove('oculto'); $('#bReini').onclick = reiniciarPrograma;
    } else f.classList.add('oculto');
    const v = $('#verProg'); if (v) v.innerHTML = textoVersao(a);
    mostrarVersao(a);
  } catch (e) {}
}
function mostrarVersao(a) {
  const el = $('#versao'); if (!el) return;
  if (!S.local) { el.textContent = 'Versão online'; el.className = 'versao'; return; }
  if (!a) return;
  if (a.status === 'pronta') { el.textContent = `Versão ${a.versao} → ${a.nova} pronta`; el.className = 'versao nova'; el.onclick = reiniciarPrograma; el.title = 'Clique para reiniciar na versão nova'; }
  else { el.textContent = `Versão ${a.versao}` + (a.status === 'baixando' ? ' · baixando atualização…' : ''); el.className = 'versao'; el.onclick = () => { location.hash = 'empresa'; }; el.title = a.checado ? 'Última verificação: ' + a.checado : 'Versão do programa'; }
}
function textoVersao(a) {
  if (!a) return '';
  const st = { verificando: 'procurando atualização…', baixando: `baixando a versão ${esc(a.nova || '')}…`, pronta: `versão ${esc(a.nova)} pronta, reinicie para usar`, atualizado: 'você está na versão mais recente', erro: 'não consegui verificar agora' + (a.erro ? ` (${esc(a.erro)})` : ''), ocioso: '' }[a.status] || '';
  return `Versão do programa: <b>${esc(a.versao)}</b>${st ? ' · ' + st : ''}${a.checado ? ` · verificado em ${esc(a.checado)}` : ''}`;
}
async function reiniciarPrograma() {
  if (pendencias() && !(await confirmar('Reiniciar agora?', 'Há contas importadas ainda não geradas. Elas serão descartadas ao reiniciar.', 'Reiniciar'))) return;
  const f = $('#faixaAtual'); f.innerHTML = '<span class="carregando"></span> Reiniciando na versão nova…';
  fila.length = 0; empresaPendente = false;
  try { await fetch('/api/reiniciar', { method: 'POST' }); } catch (e) {}
  const ini = Date.now();
  const espera = async () => { try { const r = await fetch('/api/atualizacao'); const a = await r.json(); if (a.status !== 'pronta') { location.reload(); return; } } catch (e) {} if (Date.now() - ini < 40000) setTimeout(espera, 1000); else f.textContent = 'Não consegui reiniciar. Feche e abra o programa de novo.'; };
  setTimeout(espera, 1500);
}
async function iniciarDados() {
  if (window.LOCAL_API) { try { await iniciarLocal(); } catch (e) { faixa('O programa não respondeu. Feche esta janela e abra o Faturamento Solar de novo.'); } return; }
  let db = null;
  try { db = window.claude ? await Promise.race([claude.use('db'), new Promise(r => setTimeout(() => r(null), 10000))]) : null; } catch (e) { db = null; }
  try { S.down = window.claude ? await claude.use('downloads') : null; } catch (e) { S.down = null; }
  if (!db) {
    const m = memoria.ler();
    S.clientes = m.clientes || []; S.faturas = m.faturas || []; S.empresa = m.empresa || {};
    S.pronto = { c: true, f: true, e: true };
    faixa('Atenção: o armazenamento na nuvem não está disponível nesta visualização. Os dados ficam só neste navegador e podem ser perdidos.');
    render(); return;
  }
  S.db = db; S.nuvem = true; mostrarVersao(null);
  const timer = setTimeout(() => { if (!(S.pronto.c && S.pronto.f && S.pronto.e)) faixa('Não consegui carregar os dados ainda. Verifique sua conexão.'); }, 10000);
  const pronto = () => { if (S.pronto.c && S.pronto.f && S.pronto.e) { clearTimeout(timer); faixa(''); } render(); };
  const erro = e => { faixa('Erro ao acessar os dados (' + (e && e.code || 'desconhecido') + '). Recarregue a página.'); };
  db.collection('clientes').onSnapshot(s => { S.clientes = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) S.pronto.c = true; pronto(); }, erro);
  db.collection('faturas').onSnapshot(s => { S.faturas = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) S.pronto.f = true; pronto(); }, erro);
  db.doc('config/empresa').onSnapshot(s => { S.empresa = s.exists ? s.data() : {}; if (!s.metadata.fromCache) S.pronto.e = true; aplicarMarca(); pronto(); }, erro);
}
function faixa(t) { const f = $('#faixa'); f.textContent = t; f.classList.toggle('oculto', !t); }

async function salvar(col, id, dados) {
  if (S.local) {
    await API.gravar(col, id, dados);
    const arr = S[col]; const i = arr.findIndex(x => x.id === id); const reg = { id, ...dados }; if (i >= 0) arr[i] = reg; else arr.push(reg); render();
  } else if (S.db) {
    try { await S.db.collection(col).doc(id).set(dados); }
    catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await S.db.collection(col).doc(id).set(dados); } else throw e; }
  } else {
    const arr = S[col]; const i = arr.findIndex(x => x.id === id);
    const reg = { id, ...dados }; if (i >= 0) arr[i] = reg; else arr.push(reg); memoria.gravar(); render();
  }
}
async function apagar(col, id) {

const MODELOS = {
  percentual_creditos: 'Desconto % sobre a energia injetada',
  percentual_tarifa: 'Desconto % sobre a tarifa cheia de consumo',
  preco_kwh: 'Preço fixo por kWh compensado'

// Linhas de energia injetada: kWh × tarifa do mês = valor. Recalcula os totais da conta a partir delas.
function sincronizarInjecoes(k) {
  if (!Array.isArray(k.injecoes)) return;
  const ls = k.injecoes;
  k.compensadoKwh = ls.reduce((s2, l) => s2 + (+l.kwh || 0), 0);
  k.valorCreditos = r2(ls.reduce((s2, l) => s2 + (+l.valor || 0), 0));
  const g = {};
  for (const l of ls) { const gd = l.gd === 'GD II' ? 'GD II' : 'GD I'; const x = g[gd] || (g[gd] = { gd, kwh: 0, valor: 0, tarifas: [] }); x.kwh += +l.kwh || 0; x.valor += +l.valor || 0; if (+l.tarifa && !x.tarifas.includes(+l.tarifa)) x.tarifas.push(+l.tarifa); }
  k.creditosPorTipo = Object.values(g).map(x => ({ gd: x.gd, kwh: x.kwh, valor: r2(x.valor), tarifa: x.tarifas.length === 1 ? x.tarifas[0] : null })).sort((a, b) => a.gd.localeCompare(b.gd));
}
const fmtTarifa = v => (v == null || isNaN(v)) ? '—' : 'R$ ' + (+v).toLocaleString('pt-BR', { minimumFractionDigits: 5, maximumFractionDigits: 6 });
// Grupos de energia injetada (GD I / GD II) lidos da conta; se os valores foram editados à mão, vira um grupo só
function gruposInjetada(conta) {
  const kwh = +conta.compensadoKwh || 0, creditos = +conta.valorCreditos || 0;
  const g = (conta.creditosPorTipo || []).filter(x => x && x.valor > 0);
  const soma = r2(g.reduce((s2, x) => s2 + x.valor, 0)), somaK = g.reduce((s2, x) => s2 + (x.kwh || 0), 0);
  if (g.length && Math.abs(soma - creditos) < 0.02 && Math.abs(somaK - kwh) < 0.5) return g.map(x => ({ gd: x.gd === 'GD II' ? 'GD II' : 'GD I', kwh: x.kwh || 0, valor: x.valor, tarifa: x.tarifa ?? null }));
  return [{ gd: g.length === 1 && g[0].gd === 'GD II' ? 'GD II' : 'GD I', kwh, valor: creditos }];
}
const descGD = (cli) => (+cli.desconto || 0) / 100; // o mesmo desconto vale para GD I e GD II
function calcular(conta, cli) {
  const kwh = +conta.compensadoKwh || 0;
  const creditos = +conta.valorCreditos || 0;
  const totalConta = +conta.totalConta || 0;
  const modelo = cli.modelo || 'percentual_creditos';
  let base, valorUsina, descontoValor, grupos = [];
  if (modelo === 'preco_kwh') { base = creditos; valorUsina = kwh * (+cli.precoKwh || 0); descontoValor = base - valorUsina; }
  else {
    // Soma toda a energia injetada, aplicando o desconto de cada modalidade (GD I e GD II)
    grupos = gruposInjetada(conta).map(g => {
      const gb = modelo === 'percentual_tarifa' ? g.kwh * (+conta.tarifaConsumo || 0) : g.valor;
      const d = descGD(cli, g.gd); const dv = r2(gb * d);
      return { gd: g.gd, kwh: g.kwh, tarifa: modelo === 'percentual_tarifa' ? (+conta.tarifaConsumo || 0) : (g.tarifa ?? null), base: r2(gb), descontoPct: d, descontoValor: dv, valorUsina: r2(gb - dv) };
    });
    base = r2(grupos.reduce((s2, g) => s2 + g.base, 0)); descontoValor = r2(base * descGD(cli)); valorUsina = base - descontoValor;
  }
  base = r2(base); valorUsina = r2(valorUsina); descontoValor = r2(descontoValor);
  const ajuste = +conta.ajusteGD || 0;
  const semUsina = r2(totalConta + creditos - ajuste);
  const comUsina = r2(totalConta + valorUsina);
  const economia = r2(semUsina - comUsina);
  const incluir = !!cli.incluirEnergisa;
  const valorCobrado = r2(valorUsina + (incluir ? totalConta : 0));
  const descontoPct = modelo === 'preco_kwh' ? null : (base ? descontoValor / base : descGD(cli, 'GD I'));
  return { modelo, kwh, creditos, base, grupos, descontoPct, precoKwh: modelo === 'preco_kwh' ? +cli.precoKwh || 0 : null, descontoValor, valorUsina, totalConta, semUsina, comUsina, economia, economiaPct: semUsina ? economia / semUsina : 0, incluirEnergisa: incluir, valorCobrado };
}

function textoDesconto(V) {
  if (V.modelo === 'preco_kwh') return fmtR(V.precoKwh) + '/kWh';

// ======================= PIX (BR Code estático) =======================
function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 .\-]/g, '').trim(); }

function normalizarChave(k) {
  k = String(k || '').trim(); if (!k) return '';
  if (k.includes('@')) return k.toLowerCase();
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k)) return k.toLowerCase();
  const d = soDig(k);
  if (k.startsWith('+')) return '+' + d;
  if (/[()\s-]/.test(k) && (d.length === 10 || d.length === 11) && !/^\d{3}\.\d{3}/.test(k)) return '+55' + d;
  if (d.length === 11 || d.length === 14) return d;
  if (d.length === 10) return '+55' + d;

}
function pixPayload({ chave, nome, cidade, valor, txid }) {
  const f = (id, v) => id + String(v.length).padStart(2, '0') + v;
  const ch = normalizarChave(chave); if (!ch) return '';
  const mai = f('00', 'br.gov.bcb.pix') + f('01', ch);
  let p = f('00', '01') + f('26', mai) + f('52', '0000') + f('53', '986');
  if (valor > 0) p += f('54', (+valor).toFixed(2));
  p += f('58', 'BR') + f('59', (semAcento(nome).toUpperCase() || 'RECEBEDOR').slice(0, 25)) + f('60', (semAcento(cidade).toUpperCase() || 'BRASIL').slice(0, 15));
  p += f('62', f('05', (String(txid || '***').replace(/[^A-Za-z0-9]/g, '') || '***').slice(0, 25)));

// Escolhe a chave Pix pela pessoa titular da conta de energia (CPF ou nome); se não houver, usa a da empresa
function escolherPix(E, conta) {
  const lista = (E.pixTitulares || []).filter(t => t && t.chave);
  const doc = soDig(conta.documento || conta.titularDoc || '');
  let t = doc && lista.find(x => soDig(x.cpf) === doc || soDig(x.chave) === doc);
  const nome = conta.titular || conta.nome || '';
  if (!t && nome) t = lista.find(x => nomesParecidos(nome, x.titular));
  if (t) return { chave: t.chave, nome: t.recebedor || t.titular, cidade: t.cidade || E.pixCidade || '', titular: t.titular, porTitular: true };
  return E.pixChave ? { chave: E.pixChave, nome: E.pixNome || E.nome, cidade: E.pixCidade || '', titular: '', porTitular: false } : null;
}

async function lerPdf(arquivo) {

// PDF mínimo com a imagem JPEG da fatura (uma página A4)
function pdfDeJpeg(jpegBytes, wPx, hPx) {
  const enc = new TextEncoder(); const partes = []; let off = 0; const offs = [];
  const add = b => { if (typeof b === 'string') b = enc.encode(b); partes.push(b); off += b.length; };
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (n, corpo) => { offs[n] = off; add(`${n} 0 obj\n`); corpo(); add('\nendobj\n'); };
  const PW = 595.28, PH = 841.89;
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`));
  const cont = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  obj(4, () => add(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`));
  obj(5, () => { add(`<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`); add(jpegBytes); add('\nendstream'); });
  const xref = off;
  let x = 'xref\n0 6\n0000000000 65535 f \n'; for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  add(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(off); let p = 0; for (const b of partes) { out.set(b, p); p += b.length; } return out;
}

}
function modal(html, cls = '') { const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = `<div class="modal ${cls}">${html}</div>`; $('#modais').appendChild(ov); ov.addEventListener('click', e => { if (e.target.closest('[data-fechar]')) fechar(ov); }); /* clicar fora não fecha, para não perder o que foi digitado */ return ov; }
function fechar(ov) { ov.remove(); render(); }
function confirmar(titulo, texto, ok = 'Confirmar') { return new Promise(res => { const ov = modal(`<div class="cab"><b>${esc(titulo)}</b></div><div class="corpo"><p>${esc(texto)}</p><div class="linha" style="justify-content:flex-end"><button class="btn" id="cN">Cancelar</button><button class="btn pri" id="cS">${esc(ok)}</button></div></div>`, 'peq'); $('#cN', ov).onclick = () => { ov.remove(); res(false); }; $('#cS', ov).onclick = () => { ov.remove(); res(true); }; }); }
function mostrarTexto(titulo, t) { const ov = modal(`<div class="cab"><b>${esc(titulo)}</b><div class="esp"></div><button class="btn" data-fechar>Fechar</button></div><div class="corpo"><p class="pequeno">Selecione e copie o texto abaixo.</p><textarea style="width:100%;height:110px;font-family:monospace;font-size:12px" readonly>${esc(t)}</textarea></div>`, 'peq'); const ta = $('textarea', ov); ta.focus(); ta.select(); }

const fila = []; // contas importadas aguardando geração
function contaVazia() { const d = new Date(); return { manual: true, avisos: [], itens: [], historico: [], distribuidora: 'Energisa Paraíba', uc: '', mesRef: d.getMonth() + 1, anoRef: d.getFullYear(), vencimento: '', totalConta: 0, consumoKwh: 0, compensadoKwh: 0, valorCreditos: 0, ajusteGD: 0, tarifaConsumo: 0, injecoes: [{ gd: 'GD I', origem: '', kwh: 0, tarifa: 0, valor: 0 }], nome: '', documento: '', endereco: '' }; }
function ucsDe(c) { return c && Array.isArray(c.ucs) && c.ucs.length ? c.ucs : (c && c.uc ? [{ uc: c.uc, titular: '' }] : []); }
function temUc(c, uc) { const d = soDig(uc); return !!d && ucsDe(c).some(u => soDig(u.uc) === d); }
function acharCliente(uc) { return S.clientes.find(c => temUc(c, uc)) || null; }
const NOVO_CLI = () => ({ nome: '', documento: '', endereco: '', telefone: '', email: '', modelo: 'percentual_creditos', desconto: 15, descontoGD2: 15, precoKwh: '', incluirEnergisa: true });

async function importar(arquivos) {
  if (!arquivos.length) return;
  for (const a of arquivos) {
    const item = { id: novoId(), arquivo: a.name, carregando: true, venc: vencPadrao() };
    fila.unshift(item); render();
    try {
      item.conta = await lerPdf(a); sincronizarInjecoes(item.conta);
      const d = duplicidade(item);
      if (d) { // não aceita conta em duplicidade
        fila.splice(fila.indexOf(item), 1);
        recusadas.unshift({ arquivo: a.name, texto: d.texto, faturaId: d.fatura ? d.fatura.id : '' });
        toast(`${a.name} não foi aceito: conta em duplicidade.`, 5000); render(); continue;
      }
      const c = acharCliente(item.conta.uc); item.clienteId = c ? c.id : '';
      if (!c) item.novoCli = NOVO_CLI();
    } catch (e) { console.error(e); item.erro = e.message || String(e); }
    item.carregando = false; render();
  }
}

function clienteDoItem(item) { return item.clienteId ? S.clientes.find(c => c.id === item.clienteId) : null; }
function existente(item) { const k = item.conta; return S.faturas.find(f => soDig(f.cliente.uc) === soDig(k.uc) && f.conta.mesRef === +k.mesRef && f.conta.anoRef === +k.anoRef); }
// Duplicidade: mesma UC no mesmo mês, ou a mesma nota fiscal da Energisa, já faturada ou já na fila
function mesmaConta(a, b) {
  if (!a || !b) return false;
  const nfA = soDig(a.notaFiscal), nfB = soDig(b.notaFiscal);
  if (nfA && nfB && nfA === nfB) return true;
  return !!soDig(a.uc) && soDig(a.uc) === soDig(b.uc) && +a.mesRef === +b.mesRef && +a.anoRef === +b.anoRef;
}
function duplicidade(item) {
  const k = item.conta; if (!k) return null;
  const f = S.faturas.find(x => mesmaConta(x.conta, k));
  if (f) return { texto: `Esta conta já foi faturada: fatura Nº ${f.numeroTxt} de ${f.cliente.nome} (UC ${f.cliente.uc}, ${refTxt(f.conta.mesRef, f.conta.anoRef)}).`, fatura: f };
  const o = fila.find(x => x !== item && x.conta && !x.erro && mesmaConta(x.conta, k));
  if (o) return { texto: `Esta conta já está na lista para faturar (${o.arquivo}).`, item: o };
  return null;
}
const recusadas = [];

  }));

  return el;
}

function avisoNaoCompensado(k, regra) {
  const falta = Math.round((+k.consumoKwh || 0) - (+k.compensadoKwh || 0));
  if (!(falta > 0) || !(+k.consumoKwh) || !(+k.compensadoKwh)) return '';
  const minimo = { MONOFASICO: 30, BIFASICO: 50, TRIFASICO: 100 }[semAcento(k.ligacao || '').toUpperCase()];
  const ehMinimo = minimo && falta === minimo;
  return `<div class="aviso" style="margin-top:8px">${fmtN(falta)} kWh do consumo não foram compensados pela usina${ehMinimo ? ` (é o consumo mínimo da ligação ${esc((k.ligacao || '').toLowerCase())}, que a Energisa sempre cobra)` : ''}. Esse valor já está na conta da Energisa${regra && regra.incluirEnergisa ? ', que entra na sua fatura' : ', paga direto pelo cliente'}. O desconto vale só sobre a energia injetada.</div>`;
}
function calcHtml(V) {
  if (V.modelo !== 'preco_kwh' && !(V.base > 0)) return `        <div class="calc">
          <div class="l"><span>Sem energia injetada neste mês</span><span>${fmtR(0)}</span></div>
          ${V.incluirEnergisa ? `<div class="l"><span>Conta da distribuidora</span><span>${fmtR(V.totalConta)}</span></div>` : ''}

async function gerar(item, silencioso = false) {

    let cli = clienteDoItem(item);

        if (vincular) { novo.ucs = [...ucsDe(cli), { uc: k.uc, titular: k.nome || '' }]; novo.uc = novo.ucs[0].uc; }
        await salvar('clientes', cli.id, novo); cli = { id: cli.id, ...novo };
      }
    } else {
      const n = item.novoCli; if (!n || !n.nome) { toast('Informe o nome do cliente.'); return false; }
      const id = novoId(); const dados = { nome: n.nome, documento: n.documento || '', uc: k.uc, ucs: [{ uc: k.uc, titular: k.nome || '' }], endereco: n.endereco || '', telefone: n.telefone || '', email: n.email || '', modelo: n.modelo || 'percentual_creditos', desconto: +n.desconto || 0, descontoGD2: n.descontoGD2 != null && n.descontoGD2 !== '' ? +n.descontoGD2 : +n.desconto || 0, precoKwh: +n.precoKwh || 0, incluirEnergisa: !!n.incluirEnergisa, criadoEm: dataBR(new Date()) };
      await salvar('clientes', id, dados); cli = { id, ...dados }; item.clienteId = id;

    if (dupl) { toast('Conta em duplicidade: ' + dupl.texto, 6000); return false; }
    const E = emp(); const dup = null;
    const numero = dup ? dup.numero : (+E.proximoNumero || 1);
    const numeroTxt = String(numero).padStart(6, '0');
    const V = calcular(k, cli);
    if (!(V.valorCobrado > 0)) { toast('Esta conta não tem energia injetada e a conta da Energisa não está incluída na fatura deste cliente: o valor ficaria zero.', 6000); return false; }
    const rk = refKey(k.mesRef, k.anoRef);
    const anteriores = S.faturas.filter(f => f.clienteId === cli.id && f.refKey < rk).reduce((s, f) => s + (f.calculo.economia || 0), 0);
    const conta = { distribuidora: k.distribuidora || '', uc: k.uc, mesRef: +k.mesRef, anoRef: +k.anoRef, vencimento: k.vencimento || '', totalConta: +k.totalConta || 0, consumoKwh: +k.consumoKwh || 0, compensadoKwh: +k.compensadoKwh || 0, valorCreditos: +k.valorCreditos || 0, ajusteGD: +k.ajusteGD || 0, creditosPorTipo: k.creditosPorTipo || [], injecoes: (k.injecoes || []).slice(0, 30), titular, titularDoc: k.documento || '', ligacao: k.ligacao || '', enderecoUc: k.endereco || '', tarifaConsumo: +k.tarifaConsumo || 0, tarifaCompensada: k.tarifaCompensada || null, leituraAnterior: k.leituraAnterior || '', leituraAtual: k.leituraAtual || '', dias: k.dias || null, notaFiscal: k.notaFiscal || '', saldoKwh: k.saldoKwh ?? null, historico: (k.historico || []).slice(-13), itens: (k.itens || []).slice(0, 20) };

    const empresaSnap = { nome: E.nome, cnpj: E.cnpj, endereco: E.endereco, telefone: E.telefone, email: E.email, cor: E.cor, pixChave: E.pixChave, pixNome: E.pixNome, pixCidade: E.pixCidade, mensagem: E.mensagem, logo: E.logo };

async function gerarTodas() {

function editarCliente(c) {

  const ov = modal(`<div class="cab"><b>${c ? 'Editar cliente' : 'Novo cliente'}</b><div class="esp"></div><button class="btn" id="bFecharC">Fechar</button></div><div class="corpo"><div id="fc"></div>

  ov.querySelector('.modal').style.maxWidth = '640px';

    $('#ucs', ov).innerHTML = dados.ucs.map((u, i) => `<div class="grade" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;margin-bottom:8px;align-items:end">
      <label class="campo">UC<input data-u="${i}" data-f="uc" value="${esc(u.uc)}" placeholder="0.000.000.000-00"></label>
      <label class="campo">Titular da conta<input data-u="${i}" data-f="titular" value="${esc(u.titular)}" placeholder="Nome na conta da Energisa"></label>
      <button class="btn peq" data-rm="${i}" title="Remover UC">✕</button></div>`).join('') || '<p class="pequeno">Nenhuma UC.</p>';

    fechar(ov);
  };
  $('#bUc', ov).onclick = () => { dados.ucs.push({ uc: '', titular: '' }); montarUcs(); };
  $('#bSal', ov).onclick = async () => {
    ov.querySelectorAll('[data-c]').forEach(i => i.dispatchEvent(new Event('change')));
    if (!dados.nome) return toast('Informe o nome do cliente.');
    dados.ucs = dados.ucs.filter(u => soDig(u.uc));
    if (!dados.ucs.length) { montarUcs(); return toast('Informe pelo menos uma UC.'); }
    const vistos = new Set();
    for (const u of dados.ucs) {
      const d = soDig(u.uc); if (vistos.has(d)) return toast('UC repetida: ' + u.uc); vistos.add(d);

  };
  const bx = $('#bEx', ov); if (bx) bx.onclick = async () => { if (await confirmar('Excluir cliente?', `${c.nome} será removido. As faturas já geradas continuam no histórico.`, 'Excluir')) { try { await apagar('clientes', c.id); fechar(ov); toast('Cliente excluído.'); } catch (e) { erroGravar(e); } } };
}

const COR_A = '#2a78d6', COR_B = '#eb6834', COR_C = '#1baf7a';
const MES_AB = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
let painelAno = null;
const ganho = f => +(f.calculo && f.calculo.valorUsina) || 0;
function fmtK(v) { v = +v || 0; if (Math.abs(v) >= 1e6) return (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi'; if (Math.abs(v) >= 1e4) return Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil'; return Math.round(v).toLocaleString('pt-BR'); }
function passoLimpo(max) { if (max <= 0) return 1; const bruto = max / 4; const p = Math.pow(10, Math.floor(Math.log10(bruto))); const n = bruto / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barraTopo(x, y, w, h, r) { if (h <= 0) return ''; r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }

// Gráfico de colunas (empilhadas quando há mais de uma série). dados: [{rotulo, valores:[...], dica}]
function graficoColunas(dados, series, fmtEixo, W = 720) {
  const H = 230, mE = 52, mD = 8, mT = 14, mB = 26;
  const totais = dados.map(d => d.valores.reduce((a, b) => a + b, 0));
  const passo = passoLimpo(Math.max(...totais, 0)); const topo = Math.max(passo * 4, passo * Math.ceil(Math.max(...totais, 0) / passo));
  const ph = H - mT - mB, pw = W - mE - mD, slot = pw / dados.length, bw = Math.min(24, slot * .6);
  const yv = v => mT + ph - (v / topo) * ph;
  let g = '';
  for (let t = 0; t <= topo + 1e-9; t += passo) { const y = yv(t); g += `<line x1="${mE}" x2="${W - mD}" y1="${y}" y2="${y}" stroke="#e8ecea" stroke-width="1"/><text x="${mE - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#5d6b65">${fmtEixo(t)}</text>`; }
  dados.forEach((d, i) => {
    const x = mE + i * slot + (slot - bw) / 2; let base = 0; const vis = d.valores.map((v, j) => [v, j]).filter(([v]) => v > 0);
    vis.forEach(([v, j], k) => {
      const y0 = yv(base), y1 = yv(base + v); const ult = k === vis.length - 1; const h = y0 - y1 - (k > 0 ? 2 : 0);
      if (h > 0) g += ult ? `<path d="${barraTopo(x, y1, bw, h, 4)}" fill="${series[j].cor}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${series[j].cor}"/>`;
      base += v;
    });
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#5d6b65">${esc(d.rotulo)}</text>`;
    g += `<rect x="${mE + i * slot}" y="${mT}" width="${slot}" height="${ph + 6}" fill="transparent" data-dica="${esc(d.dica)}"/>`;
  });

async function recalcularFatura(f, regra) {
  const { id, ...d } = f;
  const V = calcular(f.conta, { ...regra });
  const anteriores = S.faturas.filter(x => x.clienteId === f.clienteId && x.refKey < f.refKey).reduce((s, x) => s + (x.calculo.economia || 0), 0);
  const pi = f.pixInfo || (f.empresa && f.empresa.pixChave ? { chave: f.empresa.pixChave, nome: f.empresa.pixNome || f.empresa.nome, cidade: f.empresa.pixCidade } : null);
  const novo = { ...d, calculo: V, economiaAcumulada: r2(anteriores + V.economia), pix: pi ? pixPayload({ chave: pi.chave, nome: pi.nome, cidade: pi.cidade, valor: V.valorCobrado, txid: 'FAT' + f.numeroTxt }) : '' };
  await salvar('faturas', id, novo);
  return { id, ...novo };
}

      <button class="btn peq" data-rp="${i}">✕</button></div>`).join('');
    $('#pixT').querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('input', () => { pt[+inp.dataset.p][inp.dataset.f] = inp.value.trim(); novo.pixTitulares = pt; salvarAuto(); }));
    $('#pixT').querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { pt.splice(+b.dataset.rp, 1); novo.pixTitulares = pt; montarPix(); salvarAuto(true); });
  };
  montarPix();
  $('#bAddPix').onclick = () => { pt.push({ titular: '', cpf: '', chave: '' }); novo.pixTitulares = pt; montarPix(); };
  app.querySelectorAll('[data-e]').forEach(i => i.addEventListener('input', () => { novo[i.dataset.e] = ['proximoNumero', 'diasVencimento'].includes(i.dataset.e) ? (parseInt(i.value) || 0) : i.value; salvarAuto(); }));
  // Salva sozinho enquanto você digita (não perde nada ao trocar de aba)
  let tAuto = null;
  async function salvarAuto(agora) {
    const st = $('#stE'); if (st) st.textContent = 'Salvando…';
    clearTimeout(tAuto); empresaPendente = true;
    tAuto = setTimeout(async () => {
      const d = { ...novo }; if (d.pixTitulares) d.pixTitulares = pt.filter(t => t.titular || t.cpf || t.chave);
      try { await salvarEmpresa(d); empresaPendente = false; const s2 = $('#stE'); if (s2) s2.textContent = '✓ Tudo salvo'; } catch (e) { erroGravar(e); const s2 = $('#stE'); if (s2) s2.textContent = 'Não foi possível salvar'; }
    }, agora ? 0 : 700);
  }
  $('#bSalvarE').onclick = () => salvarAuto(true);
  $('#logoArq').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const url = await reduzirLogo(f); await salvarEmpresa({ ...novo, logo: url }); toast('Logo atualizada.'); } catch (er) { erroGravar(er); } };
  const tl = $('#bTiraLogo'); if (tl) tl.onclick = async () => { try { await salvarEmpresa({ ...novo, logo: '' }); } catch (er) { erroGravar(er); } };
  $('#bTeste').onclick = () => faturaExemplo({ ...emp(), ...novo });
  const bv = $('#bVerif'); if (bv) bv.onclick = async () => { bv.disabled = true; try { await fetch('/api/atualizacao', { method: 'POST' }); } catch (e) {} const v = $('#verProg'); if (v) v.innerHTML = 'Procurando atualização…'; setTimeout(async () => { await checarAtualizacao(); bv.disabled = false; }, 4000); };
}
async function reduzirLogo(arq) {
  const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(arq); });
  const img = await carregarImg(url); if (!img) throw new Error('Imagem inválida');
  const max = 600; const s = Math.min(1, max / img.width, 240 / img.height);
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  let out = cv.toDataURL('image/png');
  if (out.length > 180000) { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const g = c2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c2.width, c2.height); g.drawImage(cv, 0, 0); out = c2.toDataURL('image/jpeg', .9); }
  return out;
}

  const k = { distribuidora: 'Energisa Paraíba', uc: '2.043.282.053-49', mesRef: 10, anoRef: 2026, vencimento: '21/10/2026', totalConta: 143.54, consumoKwh: 442, compensadoKwh: 342, valorCreditos: 290.95, tarifaConsumo: 0.97753, leituraAnterior: '02/09/2026', leituraAtual: '02/10/2026', dias: 30, notaFiscal: '009.427.231', saldoKwh: 1922, historico: [['NOV/25', 127], ['DEZ/25', 192], ['JAN/26', 126], ['FEV/26', 322], ['MAR/26', 404], ['ABR/26', 405], ['MAI/26', 476], ['JUN/26', 414], ['JUL/26', 439], ['AGO/26', 440], ['SET/26', 512], ['OUT/26', 442]].map(([mes, kwh]) => ({ mes, kwh })) };
  const cli = { nome: 'Cliente Exemplo', documento: '000.000.000-00', uc: k.uc, titular: 'FLAVIA JANYNNE PEREIRA DO NASCIMENTO', endereco: 'Rua Exemplo, 100 - São Gonçalo', modelo: 'percentual_creditos', desconto: 15, incluirEnergisa: true };
  const V = calcular(k, cli);
  const f = { numeroTxt: '000000', emissao: dataBR(new Date()), vencimento: vencPadrao(), cliente: cli, conta: k, calculo: V, economiaAcumulada: V.economia * 3, empresa: E, pix: E.pixChave ? pixPayload({ chave: E.pixChave, nome: E.pixNome || E.nome, cidade: E.pixCidade, valor: V.valorCobrado, txid: 'EXEMPLO' }) : '' };
  const ov = modal(`<div class="cab"><b>Fatura de exemplo</b><span class="pequeno">com os dados da conta enviada e 15% de desconto</span><div class="esp"></div><button class="btn" data-fechar>Fechar</button></div><div class="corpo"><div id="pv"><p class="vazio"><span class="carregando"></span></p></div></div>`);
  const cv = await desenharFatura(f); $('#pv', ov).innerHTML = `<img src="${cv.toDataURL('image/png')}" style="width:100%;max-width:760px;display:block;margin:0 auto;border:1px solid var(--line)">`;
}
